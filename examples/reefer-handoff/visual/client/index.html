<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Reefer Handoff — Yard Simulation</title>
<link rel="stylesheet" href="/sim/ui/sim.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="title-left">
      <span class="app-title">REEFER HANDOFF</span>
      <span class="app-subtitle">Yard Simulation</span>
    </div>
    <div class="title-right">
      <span id="status-round" class="status-item">Round —</span>
      <span id="status-cutoff" class="status-item">Cutoff —</span>
      <span id="status-phase" class="status-item phase-running">Phase —</span>
    </div>
  </header>
  <main id="yard-container">
    <!-- V7: loading overlay -->
    <div id="loading-overlay">
      <div class="loading-spinner"></div>
      <span class="loading-text">Connecting to simulation…</span>
    </div>
    <svg id="yard-svg" viewBox="0 0 840 440" preserveAspectRatio="xMidYMid meet">
      <!-- Lanes layer (drawn first, under nodes) -->
      <g id="lanes-layer"></g>
      <!-- Nodes layer -->
      <g id="nodes-layer"></g>
      <!-- Entities layer (tractors, reefers) — V3 -->
      <g id="entities-layer"></g>
      <!-- Effects layer (incident animations) — V4 -->
      <g id="effects-layer"></g>
    </svg>
    <!-- V5: transport controls -->
    <div id="control-bar" aria-label="Transport controls">
      <button id="btn-pause" aria-label="Pause" title="Space">⏸</button>
      <button id="btn-step" aria-label="Step one round" title="S">⏭</button>
      <div class="speed-control">
        <label for="speed-slider">Speed</label>
        <input type="range" id="speed-slider" min="0.5" max="5" step="0.5" value="1" aria-label="Simulation speed">
        <span id="speed-value">1.0×</span>
      </div>
      <div class="mode-toggle">
        <button id="btn-mode-live" class="mode-btn active" aria-label="Live mode">Live</button>
        <button id="btn-mode-replay" class="mode-btn" aria-label="Replay mode">Replay</button>
      </div>
    </div>
    <!-- V6: replay panel -->
    <div id="replay-panel" hidden>
      <div id="replay-setup">
        <label for="replay-capability">Capability</label>
        <input type="text" id="replay-capability" placeholder="Enter capability token" aria-label="Capability token">
        <button id="btn-replay-load" aria-label="Load replay">Load</button>
        <span id="replay-status"></span>
      </div>
      <div id="replay-scrub" hidden>
        <input type="range" id="replay-slider" min="0" max="0" value="0" aria-label="Replay scrubber">
        <span id="replay-frame">Frame 1/1</span>
      </div>
    </div>
    <!-- V5: entity detail panel -->
    <aside id="detail-panel" hidden>
      <div class="detail-header">
        <span id="detail-title">—</span>
        <button id="detail-close" aria-label="Close detail panel">✕</button>
      </div>
      <div id="detail-body"></div>
      <div id="detail-debugger"></div>
    </aside>
  </main>
  <!-- Event log: the last five incidents, scans, and refusals — V4 -->
  <section id="event-log-panel" aria-label="Event log">
    <div class="event-log-header">Event Log</div>
    <ul id="event-log"></ul>
  </section>
  <footer id="footer">
    <span id="connection-status" class="footer-item">Connecting…</span>
  </footer>
</div>
<script type="module" src="/sim/ui/js/sim.mjs"></script>
</body>
</html>
