<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIADNE</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading">
        <h1>ARIADNE</h1>
        <p>Initializing the labyrinth...</p>
    </div>

    <canvas id="glcanvas"></canvas>

    <div id="hud" hidden>
        <div id="crosshair">+</div>
        <div id="intensity-bar">
            <div id="intensity-fill"></div>
        </div>
        <div id="hp-bar">
            <div id="hp-fill"></div>
        </div>
        <canvas id="minimap" width="160" height="160"></canvas>
        <div id="status-chips">
            <span id="chip-round">Round: 0</span>
            <span id="chip-element">Element: Fire</span>
            <span id="chip-war">War: 0 clashes</span>
            <span id="chip-fps">FPS: 0</span>
        </div>
    </div>

    <div id="pointer-lock-prompt" hidden>
        <p>Click to enter the labyrinth</p>
    </div>

    <div id="credits">Creatures: "Animated Creatures PS1 Style" by Zsky (@Zsky_01), CC BY 4.0 - patreon.com/Zsky</div>

    <div id="hit-flash" hidden></div>
    <div id="hit-marker" class="neutral" hidden></div>
    <div id="overlay" hidden></div>

    <!-- S4: Integrated PA-BT Debugging GUI -->
    <div id="debug-panel" hidden>
        <div id="debug-header">PA-BT Explorer [Tab to close]</div>
        <div id="debug-body">
            <div id="debug-actor-list"></div>
            <div id="debug-tree"></div>
        </div>
        <div id="debug-controls"></div>
    </div>

    <script type="module" src="js/main.mjs"></script>
</body>
</html>
